<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistencia — Kine House</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf4f0; --dark:#1C1C1E; --accent:#7b753f; --green:#2D4A3E;
    --border:#e0d8cf; --muted:#6b6b5a;
    --rojo:#e8503a; --verde:#8fbf7f; --verde-bg:#d6ecca; --verde-txt:#3d6b28;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark);padding:20px;}
  .login-wrap{max-width:380px;margin:10vh auto;text-align:center;}
  .login-logo{width:72px;height:72px;border-radius:16px;background:var(--dark);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:24px;margin:0 auto 20px;}
  .login-wrap h2{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:6px;}
  .login-wrap p{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .login-wrap input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;margin-bottom:12px;}
  .login-wrap button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:white;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;}
  .login-err{color:var(--rojo);font-size:13px;margin-top:10px;display:none;}
  #app{display:none;}
  .top{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  h1{font-family:'DM Serif Display',serif;font-size:24px;}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .btn-back{padding:8px 16px;border-radius:9px;border:1px solid var(--border);background:white;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;}
  .meses{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
  .mes{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:white;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);}
  .mes.active{background:var(--green);color:white;border-color:var(--green);}
  .prof-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .ptab{padding:10px 22px;border-radius:10px;border:1px solid var(--border);background:white;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);transition:.15s;}
  .ptab:hover{border-color:var(--green);}
  .ptab.active{background:var(--green);color:white;border-color:var(--green);}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
  .search{padding:9px 14px;border:1px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px;min-width:200px;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-left:auto;align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .chip{width:14px;height:14px;border-radius:4px;display:inline-block;}
  .wrap{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  th,td{border:1px solid var(--border);padding:0;text-align:center;}
  thead th{background:var(--green);color:white;font-weight:600;padding:10px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .num-col{width:36px;} .name-col{min-width:170px;text-align:left;}
  .os-col{min-width:90px;} .ses-col{width:60px;} .tel-col{min-width:115px;}
  .asist-col{width:92px;} .obs-col{min-width:180px;} .del-col{width:36px;}
  tbody td{height:48px;vertical-align:middle;}
  tbody .name-cell{text-align:left;padding:4px 0;}
  tbody input{width:100%;height:100%;border:none;background:transparent;font-family:inherit;font-size:13px;text-align:center;padding:8px 4px;}
  tbody input.name-inp{height:auto;text-align:left;font-weight:600;padding:2px 10px 0;display:block;}
  .sesiones-cnt{display:block;line-height:1.2;font-size:11px;color:var(--muted);font-weight:500;padding:0 10px 4px;}
  tbody input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fffef8;}
  .num-cell{font-weight:700;color:white;}
  tr.estado-rojo .num-cell{background:var(--rojo);}
  tr.estado-normal .num-cell{background:var(--muted);}
  tr.estado-rojo .name-cell input.name-inp{color:var(--rojo);}
  td.asist{padding:0;}
  .asist-inner{display:flex;flex-direction:column;height:100%;}
  .asist-inner input{flex:1;height:auto;padding:4px;font-size:12px;}
  .pay-bar{height:14px;background:#f0ebe4;cursor:pointer;font-size:9px;line-height:14px;color:#b5ad9e;border-top:1px solid var(--border);user-select:none;transition:.1s;}
  .pay-bar:hover{background:#e6dfd4;}
  .asist.pagada .pay-bar{background:var(--verde);color:white;font-weight:700;}
  .asist.pagada input{background:var(--verde-bg);color:var(--verde-txt);font-weight:600;}
  .asist.empty .pay-bar{visibility:hidden;}
  .del-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:14px;}
  .del-btn:hover{color:var(--rojo);}
  .add-row{padding:12px;text-align:center;}
  .add-row button{background:none;border:1px dashed var(--accent);color:var(--accent);padding:8px 20px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;}
  .saving{position:fixed;bottom:16px;right:16px;background:var(--green);color:white;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;}
  .saving.show{opacity:1;}
</style>
</head>
<body>

<div class="login-wrap" id="login">
  <div class="login-logo">KH</div>
  <h2>Equipo Kine House</h2>
  <p>Ingresá la contraseña del equipo</p>
  <input type="password" id="pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Ingresar</button>
  <div class="login-err" id="login-err">Contraseña incorrecta</div>
</div>

<div id="app">
  <div class="top">
    <h1>Asistencia · Kine House</h1>
    <div class="top-actions">
      <a class="btn-back" href="/staff">← Panel</a>
    </div>
  </div>

  <div class="meses" id="meses"></div>

  <div class="prof-tabs">
    <div class="ptab active" data-prof="julian" onclick="setProf('julian',this)">Julián Gaffet</div>
    <div class="ptab" data-prof="mauro" onclick="setProf('mauro',this)">Mauro Ayub</div>
    <div class="ptab" data-prof="esteban" onclick="setProf('esteban',this)">Esteban Videla</div>
  </div>

  <div class="toolbar">
    <input class="search" id="buscar" placeholder="🔍 Buscar paciente..." oninput="render()">
    <div class="legend">
      <span><span class="chip" style="background:var(--verde)"></span>Pagada</span>
      <span><span class="chip" style="background:white;border:1px solid #ccc"></span>Sin pagar</span>
      <span><span class="chip" style="background:var(--rojo)"></span>Terminó</span>
    </div>
  </div>

  <div class="wrap">
    <div class="scroll">
      <table>
        <thead><tr>
          <th class="num-col">#</th><th class="name-col">Nombre y Apellido</th>
          <th class="os-col">Obra Social</th><th class="ses-col">Sesiones</th><th class="tel-col">Teléfono</th>
          <th class="asist-col" colspan="10">Asistencia — escribí la fecha o "hoy"</th>
          <th class="obs-col">Observaciones</th><th class="del-col"></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="add-row"><button onclick="addRow()">+ Agregar paciente</button></div>
  </div>
</div>

<div class="saving" id="saving">Guardando...</div>

<script>
  const MESES_NUM=['01','02','03','04','05','06','07','08','09','10','11','12'];
  const MESES_LBL=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const MESES_FECHA=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const NASIST=10;
  const YEAR=new Date().getFullYear();

  let PASSWORD='';
  let profActual='julian';
  let mesActual=YEAR+'-'+MESES_NUM[new Date().getMonth()];
  let pacientes=[];

  function fechaHoy(){ const d=new Date(); return d.getDate()+'-'+MESES_FECHA[d.getMonth()]; }

  async function login(){
    const p=document.getElementById('pass').value;
    const r=await fetch('/api/planilla?profesional=julian&mes='+mesActual,{headers:{'x-panel-password':p}});
    if(r.ok){
      PASSWORD=p;
      try{ localStorage.setItem('kh_panel_pass',p); }catch(e){}
      document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='block';
      buildMeses();
      cargar();
    } else {
      document.getElementById('login-err').style.display='block';
    }
  }
  (async ()=>{
    try{
      const saved=localStorage.getItem('kh_panel_pass');
      if(saved){
        const r=await fetch('/api/planilla?profesional=julian&mes='+mesActual,{headers:{'x-panel-password':saved}});
        if(r.ok){
          PASSWORD=saved;
          document.getElementById('login').style.display='none';
          document.getElementById('app').style.display='block';
          buildMeses();
          cargar();
        }
      }
    }catch(e){}
  })();

  function hdrs(){ return {'Content-Type':'application/json','x-panel-password':PASSWORD}; }

  function showSaving(){
    const el=document.getElementById('saving');
    el.classList.add('show');
    clearTimeout(el._t);
    el._t=setTimeout(()=>el.classList.remove('show'),900);
  }

  function buildMeses(){
    const cont=document.getElementById('meses');
    cont.innerHTML=MESES_LBL.map((m,i)=>{
      const val=YEAR+'-'+MESES_NUM[i];
      return '<div class="mes'+(val===mesActual?' active':'')+'" data-mes="'+val+'" onclick="setMes(\''+val+'\',this)">'+m+'</div>';
    }).join('');
  }
  function setMes(m, el){
    mesActual=m;
    document.querySelectorAll('.mes').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    cargar();
  }
  function setProf(p, el){
    profActual=p;
    document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    cargar();
  }

  async function cargar(){
    const r=await fetch('/api/planilla?profesional='+profActual+'&mes='+mesActual,{headers:{'x-panel-password':PASSWORD}});
    const data=await r.json();
    pacientes=(data.pacientes||[]).map(p=>{
      const dias=[];
      for(let k=0;k<NASIST;k++) dias.push({f:'',pagada:false});
      (p.sesiones||[]).forEach(s=>{ if(s.col<NASIST) dias[s.col]={f:s.fecha||'',pagada:!!s.pagada}; });
      return { id:p.id, n:p.nombre, os:p.obra_social, ses:p.sesiones_autorizadas, tel:p.telefono, obs:p.observaciones, dias };
    });
    render();
  }

  function contarRealizadas(p){ let n=0; for(const d of p.dias) if(d.f && d.f.trim()) n++; return n; }
  function contarPagadas(p){ let n=0; for(const d of p.dias) if(d.f && d.f.trim() && d.pagada) n++; return n; }
  function esRojo(p){ return contarRealizadas(p) >= p.ses; }

  function esc(s){ return (s||'').toString().replace(/"/g,'&quot;'); }

  function render(){
    const q=(document.getElementById('buscar').value||'').toLowerCase();
    let html='';
    let visible=0;
    for(let i=0;i<pacientes.length;i++){
      const p=pacientes[i];
      if(q && !(p.n||'').toLowerCase().includes(q)) continue;
      visible++;
      let cells='';
      for(let c=0;c<NASIST;c++){
        const d=p.dias[c];
        const f=d.f||'';
        const pag=(d.pagada && f)?true:false;
        cells+='<td class="asist'+(pag?' pagada':'')+(f?'':' empty')+'">'
          +'<div class="asist-inner">'
          +'<input class="fecha-inp" value="'+esc(f)+'" data-i="'+i+'" data-c="'+c+'" placeholder="—">'
          +'<div class="pay-bar" data-i="'+i+'" data-c="'+c+'">'+(pag?'✓ pagó':'pagar')+'</div>'
          +'</div></td>';
      }
      html+='<tr class="estado-'+(esRojo(p)?'rojo':'normal')+'" data-row="'+i+'">'
        +'<td class="num-cell">'+visible+'</td>'
        +'<td class="name-cell"><input class="name-inp" value="'+esc(p.n)+'" data-i="'+i+'" data-field="n">'
        +'<div class="sesiones-cnt">'+contarRealizadas(p)+'/'+p.ses+' realizadas · '+contarPagadas(p)+' pagadas</div></td>'
        +'<td><input value="'+esc(p.os)+'" data-i="'+i+'" data-field="os"></td>'
        +'<td><input value="'+p.ses+'" style="text-align:center" data-i="'+i+'" data-field="ses"></td>'
        +'<td><input value="'+esc(p.tel)+'" data-i="'+i+'" data-field="tel"></td>'
        +cells
        +'<td><input placeholder="..." value="'+esc(p.obs)+'" data-i="'+i+'" data-field="obs"></td>'
        +'<td><button class="del-btn" onclick="delRow('+i+')" title="Eliminar paciente">✕</button></td></tr>';
    }
    document.getElementById('tbody').innerHTML=html;
    bind();
  }

  function refreshContador(i){
    const fila=document.querySelector('tr[data-row="'+i+'"]');
    if(!fila) return;
    const p=pacientes[i];
    fila.querySelector('.sesiones-cnt').textContent=
      contarRealizadas(p)+'/'+p.ses+' realizadas · '+contarPagadas(p)+' pagadas';
    fila.className='estado-'+(esRojo(p)?'rojo':'normal');
    fila.setAttribute('data-row',i);
  }

  const timers={};
  function debounced(key, fn, ms){
    clearTimeout(timers[key]);
    timers[key]=setTimeout(fn, ms||600);
  }

  async function guardarPaciente(i){
    const p=pacientes[i];
    await fetch('/api/planilla/pacientes/'+p.id,{method:'PATCH',headers:hdrs(),
      body:JSON.stringify({nombre:p.n,obra_social:p.os,sesiones_autorizadas:p.ses,telefono:p.tel,observaciones:p.obs})});
    showSaving();
  }
  async function guardarSesion(i,c){
    const p=pacientes[i];
    const d=p.dias[c];
    await fetch('/api/planilla/sesion',{method:'PUT',headers:hdrs(),
      body:JSON.stringify({paciente_id:p.id,mes:mesActual,col:c,fecha:d.f,pagada:d.pagada})});
    showSaving();
  }

  function bind(){
    document.querySelectorAll('[data-field]').forEach(inp=>{
      inp.oninput=e=>{
        const i=+e.target.dataset.i, f=e.target.dataset.field;
        pacientes[i][f] = (f==='ses') ? (parseInt(e.target.value)||0) : e.target.value;
        if(f==='ses') refreshContador(i);
        debounced('pac'+i, ()=>guardarPaciente(i));
      };
    });
    document.querySelectorAll('.fecha-inp').forEach(inp=>{
      inp.oninput=e=>{
        const i=+e.target.dataset.i, c=+e.target.dataset.c;
        pacientes[i].dias[c].f=e.target.value;
        refreshContador(i);
        debounced('ses'+i+'-'+c, ()=>guardarSesion(i,c));
      };
      inp.onblur=e=>{
        const i=+e.target.dataset.i, c=+e.target.dataset.c;
        const v=e.target.value.trim();
        if(v.toLowerCase()==='hoy'){
          pacientes[i].dias[c].f=fechaHoy();
          guardarSesion(i,c);
          render();
        }
      };
      inp.onkeydown=e=>{ if(e.key==='Enter') e.target.blur(); };
    });
    document.querySelectorAll('.pay-bar').forEach(bar=>{
      bar.onclick=e=>{
        const i=+e.currentTarget.dataset.i, c=+e.currentTarget.dataset.c;
        const d=pacientes[i].dias[c];
        if(d.f && d.f.trim()){
          d.pagada=!d.pagada;
          guardarSesion(i,c);
          render();
        }
      };
    });
  }

  async function addRow(){
    const r=await fetch('/api/planilla/pacientes',{method:'POST',headers:hdrs(),
      body:JSON.stringify({nombre:'',obra_social:'',sesiones_autorizadas:10,telefono:'',observaciones:'',profesional:profActual})});
    const d=await r.json();
    pacientes.push({id:d.id,n:'',os:'',ses:10,tel:'',obs:'',dias:Array.from({length:NASIST},()=>({f:'',pagada:false}))});
    render();
    showSaving();
  }

  async function delRow(i){
    const p=pacientes[i];
    if(!confirm('¿Eliminar a "'+(p.n||'este paciente')+'" de la planilla?')) return;
    await fetch('/api/planilla/pacientes/'+p.id,{method:'DELETE',headers:hdrs()});
    pacientes.splice(i,1);
    render();
    showSaving();
  }
</script>
</body>
</html>
