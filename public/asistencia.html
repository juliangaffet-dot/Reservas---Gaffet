<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kine House — Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-50:#E1F5EE; --green-100:#9FE1CB; --green-500:#1D9E75; --green-700:#0F6E56; --green-900:#04342C;
      --gray-50:#F8F7F4; --gray-100:#EFEFEB; --gray-300:#D3D1C7; --gray-500:#888780; --gray-700:#444441; --gray-900:#1A1A18;
      --amber-50:#FAEEDA; --amber-800:#633806; --red-50:#FCEBEB; --red-500:#E53E3E;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; background:var(--gray-50); color:var(--gray-900); min-height:100vh; }
    .page-wrapper { max-width:620px; margin:0 auto; min-height:100vh; background:white; box-shadow:0 0 60px rgba(0,0,0,0.06); }

    /* LOGIN */
    .login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:2rem; }
    .login-box { width:100%; max-width:340px; }
    .login-title { font-family:'DM Serif Display',serif; font-size:24px; color:var(--green-900); margin-bottom:4px; }
    .login-sub { font-size:13px; color:var(--gray-500); margin-bottom:1.5rem; }
    .login-input { width:100%; border:0.5px solid var(--gray-300); border-radius:8px; padding:10px 14px; font-family:'DM Sans',sans-serif; font-size:15px; margin-bottom:12px; }
    .login-btn { width:100%; padding:12px; background:var(--green-500); color:white; border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500; cursor:pointer; }
    .login-error { color:var(--red-500); font-size:13px; margin-top:8px; display:none; }

    /* HEADER */
    .header { background:#2D4A3E; padding:1.25rem 1.5rem; }
    .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
    .header-title { font-family:'DM Serif Display',serif; font-size:20px; color:white; }
    .header-actions { display:flex; gap:8px; }
    .tab-btn { background:rgba(255,255,255,0.1); border:0.5px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.7); font-size:12px; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:'DM Sans',sans-serif; font-weight:500; transition:all 0.15s; }
    .tab-btn.active { background:var(--green-500); border-color:var(--green-500); color:white; }
    .logout-btn { background:none; border:0.5px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer; font-family:'DM Sans',sans-serif; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; }
    .ctrl-input { flex:1; min-width:110px; border:0.5px solid rgba(255,255,255,0.2); border-radius:8px; padding:8px 10px; font-family:'DM Sans',sans-serif; font-size:13px; background:rgba(255,255,255,0.1); color:white; }
    .ctrl-input option { background:#2D4A3E; }
    .ctrl-input:focus { outline:none; border-color:var(--green-100); }
    .ctrl-btn { padding:8px 14px; background:var(--green-500); color:white; border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; }

    /* CONTENIDO */
    .content { padding:1.25rem; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    /* STATS */
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:1.25rem; }
    .stat-box { background:var(--gray-50); border:0.5px solid var(--gray-300); border-radius:10px; padding:10px; text-align:center; }
    .stat-num { font-size:22px; font-weight:500; }
    .stat-label { font-size:11px; color:var(--gray-500); margin-top:2px; }
    .stat-box.asistio .stat-num { color:var(--green-700); }
    .stat-box.ausente .stat-num { color:var(--red-500); }
    .stat-box.pendiente .stat-num { color:var(--amber-800); }

    /* TURNO CARD */
    .lista { display:flex; flex-direction:column; gap:8px; margin-bottom:1.25rem; }
    .turno-card { border:0.5px solid var(--gray-300); border-radius:10px; padding:12px 14px; }
    .turno-card.asistio { border-color:var(--green-100); background:var(--green-50); }
    .turno-card.ausente { border-color:#F09595; background:var(--red-50); }
    .turno-top { display:flex; align-items:center; gap:10px; }
    .turno-hora { font-size:15px; font-weight:500; min-width:44px; color:var(--gray-700); }
    .turno-info { flex:1; }
    .turno-nombre { font-size:14px; font-weight:500; color:var(--gray-900); }
    .turno-sub { font-size:11px; color:var(--gray-500); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; }
    .badge-sesiones { font-size:11px; font-weight:500; padding:2px 7px; border-radius:99px; }
    .badge-ok { background:var(--green-50); color:var(--green-700); border:0.5px solid var(--green-100); }
    .badge-pocas { background:var(--amber-50); color:var(--amber-800); border:0.5px solid #f0c87a; }
    .badge-agotado { background:var(--red-50); color:var(--red-500); border:0.5px solid #F09595; }
    .badge-sin-pac { background:var(--gray-100); color:var(--gray-500); border:0.5px solid var(--gray-300); }
    .estado-badge { font-size:11px; font-weight:500; padding:3px 8px; border-radius:99px; white-space:nowrap; }
    .estado-badge.asistio { background:var(--green-100); color:var(--green-900); }
    .estado-badge.ausente { background:#F09595; color:#7A1111; }
    .estado-badge.pendiente { background:var(--amber-50); color:var(--amber-800); }
    .turno-actions { display:flex; gap:4px; margin-top:8px; justify-content:flex-end; }
    .action-btn { border:none; border-radius:6px; padding:5px 10px; font-size:12px; font-family:'DM Sans',sans-serif; cursor:pointer; font-weight:500; }
    .btn-asistio { background:var(--green-500); color:white; }
    .btn-ausente { background:var(--red-500); color:white; }
    .btn-pendiente { background:var(--gray-300); color:var(--gray-700); }

    /* SECCIÓN FORMULARIOS */
    .form-section { border:0.5px solid var(--gray-300); border-radius:10px; padding:14px; margin-bottom:1rem; }
    .form-section.dashed { border-style:dashed; border-color:var(--green-100); }
    .form-title { font-size:12px; font-weight:500; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
    .form-row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    .form-input { flex:1; min-width:120px; border:0.5px solid var(--gray-300); border-radius:7px; padding:8px 10px; font-family:'DM Sans',sans-serif; font-size:13px; }
    .form-input:focus { outline:none; border-color:var(--green-500); }
    .form-select { flex:1; min-width:120px; border:0.5px solid var(--gray-300); border-radius:7px; padding:8px 10px; font-family:'DM Sans',sans-serif; font-size:13px; background:white; }
    .form-btn { padding:8px 16px; background:var(--green-500); color:white; border:none; border-radius:7px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; }
    .form-btn:hover { background:var(--green-700); }
    .cerrar-btn { width:100%; padding:12px; background:#2D4A3E; color:white; border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; margin-bottom:1rem; }

    /* PACIENTES */
    .pac-card { border:0.5px solid var(--gray-300); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
    .pac-top { display:flex; align-items:center; gap:10px; }
    .pac-avatar { width:36px; height:36px; border-radius:50%; background:#2D4A3E; display:flex; align-items:center; justify-content:center; color:white; font-size:13px; font-weight:500; flex-shrink:0; }
    .pac-info { flex:1; }
    .pac-nombre { font-size:14px; font-weight:500; color:var(--gray-900); }
    .pac-sub { font-size:12px; color:var(--gray-500); margin-top:2px; }
    .pac-sesiones { text-align:right; }
    .pac-num { font-size:20px; font-weight:500; }
    .pac-num.ok { color:var(--green-700); }
    .pac-num.pocas { color:var(--amber-800); }
    .pac-num.agotado { color:var(--red-500); }
    .pac-label { font-size:10px; color:var(--gray-500); }
    .pac-barra { height:4px; border-radius:2px; background:var(--gray-100); margin-top:10px; overflow:hidden; }
    .pac-barra-fill { height:100%; border-radius:2px; background:var(--green-500); transition:width 0.3s; }
    .pac-barra-fill.pocas { background:#f0c87a; }
    .pac-barra-fill.agotado { background:var(--red-500); }
    .pac-actions { display:flex; gap:6px; margin-top:10px; justify-content:flex-end; }
    .pac-btn { border:none; border-radius:6px; padding:5px 10px; font-size:12px; font-family:'DM Sans',sans-serif; cursor:pointer; font-weight:500; }
    .pac-btn-edit { background:var(--gray-100); color:var(--gray-700); }
    .pac-btn-del { background:var(--red-50); color:var(--red-500); }
    .pac-btn-add { background:var(--green-50); color:var(--green-700); }
    .pac-btn-sub { background:var(--amber-50); color:var(--amber-800); }

    /* MODAL */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50; align-items:center; justify-content:center; padding:1rem; }
    .modal-overlay.open { display:flex; }
    .modal { background:white; border-radius:14px; padding:1.5rem; width:100%; max-width:360px; }
    .modal-title { font-size:16px; font-weight:500; margin-bottom:1rem; color:var(--gray-900); }
    .modal-input { width:100%; border:0.5px solid var(--gray-300); border-radius:8px; padding:10px 12px; font-family:'DM Sans',sans-serif; font-size:14px; margin-bottom:10px; }
    .modal-input:focus { outline:none; border-color:var(--green-500); }
    .modal-select { width:100%; border:0.5px solid var(--gray-300); border-radius:8px; padding:10px 12px; font-family:'DM Sans',sans-serif; font-size:14px; margin-bottom:10px; background:white; }
    .modal-btns { display:flex; gap:8px; }
    .modal-btn-ok { flex:1; padding:10px; background:var(--green-500); color:white; border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; }
    .modal-btn-cancel { flex:1; padding:10px; background:var(--gray-100); color:var(--gray-700); border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; }

    .empty { text-align:center; padding:2rem; color:var(--gray-500); font-size:14px; }
    .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); background:var(--green-900); color:white; padding:10px 20px; border-radius:8px; font-size:13px; font-weight:500; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:100; }
    .toast.show { opacity:1; }
    .prof-tag { font-size:10px; background:var(--gray-100); color:var(--gray-500); border-radius:4px; padding:1px 5px; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="login-title">Kine House</div>
    <div class="login-sub">Panel de asistencia</div>
    <input type="password" id="inp-pass" class="login-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter') login()">
    <button class="login-btn" onclick="login()">Ingresar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<!-- PANEL -->
<div id="panel" class="page-wrapper" style="display:none;">
  <div class="header">
    <div class="header-top">
      <div class="header-title">Kine House</div>
      <div class="header-actions">
        <button class="tab-btn active" id="tab-asistencia-btn" onclick="switchTab('asistencia')">Asistencia</button>
        <button class="tab-btn" id="tab-pacientes-btn" onclick="switchTab('pacientes')">Pacientes</button>
        <button class="logout-btn" onclick="logout()">Salir</button>
      </div>
    </div>
    <div class="controls" id="ctrl-asistencia">
      <input type="date" id="ctrl-fecha" class="ctrl-input" onchange="cargarAsistencia()">
      <select id="ctrl-prof" class="ctrl-input" onchange="cargarAsistencia()">
        <option value="todos">Todos</option>
        <option value="julian">Julián</option>
        <option value="mauro">Mauro</option>
        <option value="esteban">Esteban</option>
      </select>
      <button class="ctrl-btn" onclick="cargarAsistencia()">↺</button>
    </div>
    <div class="controls" id="ctrl-pacientes" style="display:none;">
      <select id="ctrl-prof-pac" class="ctrl-input" onchange="cargarPacientes()">
        <option value="todos">Todos</option>
        <option value="julian">Julián</option>
        <option value="mauro">Mauro</option>
        <option value="esteban">Esteban</option>
      </select>
      <button class="ctrl-btn" onclick="cargarPacientes()">↺</button>
    </div>
  </div>

  <div class="content">

    <!-- TAB ASISTENCIA -->
    <div id="tab-asistencia" class="tab-content active">
      <div class="stats" id="stats" style="display:none;">
        <div class="stat-box asistio"><div class="stat-num" id="stat-asistio">0</div><div class="stat-label">Asistieron</div></div>
        <div class="stat-box ausente"><div class="stat-num" id="stat-ausente">0</div><div class="stat-label">Ausentes</div></div>
        <div class="stat-box pendiente"><div class="stat-num" id="stat-pendiente">0</div><div class="stat-label">Pendientes</div></div>
      </div>
      <div class="lista" id="lista-asistencia"></div>

      <div class="form-section dashed">
        <div class="form-title">+ Agregar paciente sin turno</div>
        <div class="form-row">
          <input type="text" id="man-nombre" class="form-input" placeholder="Nombre del paciente">
          <input type="time" id="man-hora" class="form-input" value="09:00">
        </div>
        <div class="form-row">
          <select id="man-prof" class="form-select">
            <option value="julian">Julián</option>
            <option value="mauro">Mauro</option>
            <option value="esteban">Esteban</option>
          </select>
          <button class="form-btn" onclick="agregarManual()">Agregar</button>
        </div>
      </div>

      <button class="cerrar-btn" onclick="cerrarDia()">✅ Marcar todos los pendientes como asistió</button>
    </div>

    <!-- TAB PACIENTES -->
    <div id="tab-pacientes" class="tab-content">
      <div class="form-section" style="margin-bottom:1.25rem;">
        <div class="form-title">Nuevo paciente</div>
        <div class="form-row">
          <input type="text" id="nac-nombre" class="form-input" placeholder="Nombre completo">
          <input type="text" id="nac-os" class="form-input" placeholder="Obra social">
        </div>
        <div class="form-row">
          <input type="text" id="nac-plan" class="form-input" placeholder="Plan (ej: IPS x8)">
          <select id="nac-sesiones" class="form-select">
            <option value="8">8 sesiones</option>
            <option value="10" selected>10 sesiones</option>
            <option value="12">12 sesiones</option>
            <option value="20">20 sesiones</option>
          </select>
        </div>
        <div class="form-row">
          <select id="nac-prof" class="form-select">
            <option value="julian">Julián</option>
            <option value="mauro">Mauro</option>
            <option value="esteban">Esteban</option>
          </select>
          <button class="form-btn" onclick="crearPaciente()">Agregar</button>
        </div>
      </div>
      <div id="lista-pacientes"></div>
    </div>

  </div>
</div>

<!-- MODAL EDITAR PACIENTE -->
<div class="modal-overlay" id="modal-editar">
  <div class="modal">
    <div class="modal-title">Editar paciente</div>
    <input type="hidden" id="edit-id">
    <input type="text" id="edit-nombre" class="modal-input" placeholder="Nombre">
    <input type="text" id="edit-os" class="modal-input" placeholder="Obra social">
    <input type="text" id="edit-plan" class="modal-input" placeholder="Plan">
    <div style="display:flex;gap:8px;">
      <div style="flex:1;">
        <label style="font-size:11px;color:var(--gray-500);display:block;margin-bottom:4px;">Total sesiones</label>
        <input type="number" id="edit-total" class="modal-input" min="1" max="50">
      </div>
      <div style="flex:1;">
        <label style="font-size:11px;color:var(--gray-500);display:block;margin-bottom:4px;">Usadas</label>
        <input type="number" id="edit-usadas" class="modal-input" min="0">
      </div>
    </div>
    <select id="edit-prof" class="modal-select">
      <option value="julian">Julián</option>
      <option value="mauro">Mauro</option>
      <option value="esteban">Esteban</option>
    </select>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="modal-btn-ok" onclick="guardarEdicion()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let password = '';
  let tabActual = 'asistencia';

  function hoy() {
    const now = new Date();
    const arg = new Date(now.getTime() - 3 * 60 * 60 * 1000);
    return arg.toISOString().substring(0, 10);
  }

  function login() {
    const pass = document.getElementById('inp-pass').value;
    if (!pass) return;
    password = pass;
    fetch('/api/asistencia?fecha=' + hoy(), { headers: { 'x-panel-password': pass } })
      .then(r => {
        if (r.status === 401) {
          document.getElementById('login-error').style.display = 'block';
          password = '';
        } else {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('panel').style.display = 'block';
          document.getElementById('ctrl-fecha').value = hoy();
          cargarAsistencia();
        }
      }).catch(() => { document.getElementById('login-error').style.display = 'block'; });
  }

  function logout() {
    password = '';
    document.getElementById('panel').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('inp-pass').value = '';
  }

  function switchTab(tab) {
    tabActual = tab;
    document.getElementById('tab-asistencia').classList.toggle('active', tab === 'asistencia');
    document.getElementById('tab-pacientes').classList.toggle('active', tab === 'pacientes');
    document.getElementById('tab-asistencia-btn').classList.toggle('active', tab === 'asistencia');
    document.getElementById('tab-pacientes-btn').classList.toggle('active', tab === 'pacientes');
    document.getElementById('ctrl-asistencia').style.display = tab === 'asistencia' ? 'flex' : 'none';
    document.getElementById('ctrl-pacientes').style.display = tab === 'pacientes' ? 'flex' : 'none';
    if (tab === 'pacientes') cargarPacientes();
  }

  // ─── ASISTENCIA ───────────────────────────────────────────────────────────
  async function cargarAsistencia() {
    const fecha = document.getElementById('ctrl-fecha').value;
    const prof = document.getElementById('ctrl-prof').value;
    if (!fecha) return;
    document.getElementById('lista-asistencia').innerHTML = '<div class="empty">Cargando...</div>';
    document.getElementById('stats').style.display = 'none';
    let url = `/api/asistencia?fecha=${fecha}`;
    if (prof !== 'todos') url += `&profesional=${prof}`;
    const r = await fetch(url, { headers: { 'x-panel-password': password } });
    const data = await r.json();
    const turnos = data.turnos || [];
    const stats = { asistio: 0, ausente: 0, pendiente: 0 };
    turnos.forEach(t => { if (stats[t.estado] !== undefined) stats[t.estado]++; });
    document.getElementById('stat-asistio').textContent = stats.asistio;
    document.getElementById('stat-ausente').textContent = stats.ausente;
    document.getElementById('stat-pendiente').textContent = stats.pendiente;
    document.getElementById('stats').style.display = turnos.length ? 'grid' : 'none';

    const PROF = { julian:'Julián Gaffet', mauro:'Mauro Ayub', esteban:'Esteban Videla' };
    const ESTADOS = { asistio:'Asistió', ausente:'Ausente', pendiente:'Pendiente' };
    const lista = document.getElementById('lista-asistencia');

    if (!turnos.length) { lista.innerHTML = '<div class="empty">No hay turnos para este día</div>'; return; }

    lista.innerHTML = turnos.map(t => {
      let sesionesHTML = '';
      if (t.paciente_id && t.sesiones_total) {
        const restantes = t.sesiones_total - t.sesiones_usadas;
        const clase = restantes <= 0 ? 'badge-agotado' : restantes <= 2 ? 'badge-pocas' : 'badge-ok';
        const txt = restantes <= 0 ? 'Sin sesiones' : `${restantes} sesión${restantes !== 1 ? 'es' : ''} restante${restantes !== 1 ? 's' : ''}`;
        sesionesHTML = `<span class="badge-sesiones ${clase}">${txt}</span>`;
      } else {
        sesionesHTML = `<span class="badge-sesiones badge-sin-pac">Sin ficha</span>`;
      }
      const esSinTurno = !t.email && !t.telefono && t.estado === 'asistio';
      return `
        <div class="turno-card ${t.estado}" id="tcard-${t.id}">
          <div class="turno-top">
            <div class="turno-hora">${t.hora}</div>
            <div class="turno-info">
              <div class="turno-nombre">${t.nombre}${esSinTurno ? ' <span class="prof-tag">sin turno</span>' : ''}</div>
              <div class="turno-sub">
                <span>${PROF[t.profesional] || t.profesional}</span>
                ${sesionesHTML}
              </div>
            </div>
            <span class="estado-badge ${t.estado}">${ESTADOS[t.estado]}</span>
          </div>
          <div class="turno-actions">
            ${t.estado !== 'asistio' ? `<button class="action-btn btn-asistio" onclick="cambiarEstado(${t.id},'asistio')">✓ Asistió</button>` : ''}
            ${t.estado !== 'ausente' ? `<button class="action-btn btn-ausente" onclick="cambiarEstado(${t.id},'ausente')">✗ Ausente</button>` : ''}
            ${t.estado !== 'pendiente' ? `<button class="action-btn btn-pendiente" onclick="cambiarEstado(${t.id},'pendiente')">↺</button>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  async function cambiarEstado(id, estado) {
    await fetch(`/api/asistencia/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-panel-password': password },
      body: JSON.stringify({ estado })
    });
    cargarAsistencia();
    showToast(estado === 'asistio' ? '✅ Marcado como asistió' : estado === 'ausente' ? '❌ Marcado como ausente' : '↺ Vuelto a pendiente');
  }

  async function agregarManual() {
    const nombre = document.getElementById('man-nombre').value.trim();
    const hora = document.getElementById('man-hora').value;
    const profesional = document.getElementById('man-prof').value;
    const fecha = document.getElementById('ctrl-fecha').value;
    if (!nombre || !hora || !fecha) { showToast('⚠️ Completá nombre y hora'); return; }
    await fetch('/api/asistencia/manual', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-panel-password': password },
      body: JSON.stringify({ nombre, profesional, fecha, hora })
    });
    document.getElementById('man-nombre').value = '';
    cargarAsistencia();
    showToast('✅ Paciente agregado');
  }

  async function cerrarDia() {
    const fecha = document.getElementById('ctrl-fecha').value;
    if (!confirm(`¿Marcar todos los pendientes del ${fecha} como asistió?`)) return;
    const r = await fetch('/api/asistencia/cerrar-dia', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-panel-password': password },
      body: JSON.stringify({ fecha })
    });
    const data = await r.json();
    cargarAsistencia();
    showToast(`✅ ${data.actualizados} turno(s) marcados`);
  }

  // ─── PACIENTES ────────────────────────────────────────────────────────────
  async function cargarPacientes() {
    const prof = document.getElementById('ctrl-prof-pac').value;
    let url = '/api/pacientes';
    if (prof !== 'todos') url += `?profesional=${prof}`;
    const r = await fetch(url, { headers: { 'x-panel-password': password } });
    const data = await r.json();
    const pacientes = data.pacientes || [];
    const lista = document.getElementById('lista-pacientes');
    if (!pacientes.length) { lista.innerHTML = '<div class="empty">No hay pacientes cargados</div>'; return; }

    const PROF = { julian:'Julián', mauro:'Mauro', esteban:'Esteban' };
    lista.innerHTML = pacientes.map(p => {
      const restantes = p.sesiones_total - p.sesiones_usadas;
      const pct = Math.min(100, Math.round((p.sesiones_usadas / p.sesiones_total) * 100));
      const clase = restantes <= 0 ? 'agotado' : restantes <= 2 ? 'pocas' : 'ok';
      const iniciales = p.nombre.split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
      return `
        <div class="pac-card">
          <div class="pac-top">
            <div class="pac-avatar">${iniciales}</div>
            <div class="pac-info">
              <div class="pac-nombre">${p.nombre}</div>
              <div class="pac-sub">
                ${p.obra_social || ''}${p.plan ? ' · ' + p.plan : ''}
                <span class="prof-tag">${PROF[p.profesional] || p.profesional}</span>
              </div>
            </div>
            <div class="pac-sesiones">
              <div class="pac-num ${clase}">${restantes}</div>
              <div class="pac-label">de ${p.sesiones_total}</div>
            </div>
          </div>
          <div class="pac-barra">
            <div class="pac-barra-fill ${clase}" style="width:${pct}%"></div>
          </div>
          <div class="pac-actions">
            <button class="pac-btn pac-btn-sub" onclick="ajustarSesion(${p.id}, -1)">− Sesión</button>
            <button class="pac-btn pac-btn-add" onclick="ajustarSesion(${p.id}, +1)">+ Sesión</button>
            <button class="pac-btn pac-btn-edit" onclick="abrirEditar(${p.id},'${p.nombre.replace(/'/g,"\\'")}','${(p.obra_social||'').replace(/'/g,"\\'")}','${(p.plan||'').replace(/'/g,"\\'")}',${p.sesiones_total},${p.sesiones_usadas},'${p.profesional}')">Editar</button>
            <button class="pac-btn pac-btn-del" onclick="eliminarPaciente(${p.id})">Eliminar</button>
          </div>
        </div>`;
    }).join('');
  }

  async function crearPaciente() {
    const nombre = document.getElementById('nac-nombre').value.trim();
    const obra_social = document.getElementById('nac-os').value.trim();
    const plan = document.getElementById('nac-plan').value.trim();
    const sesiones_total = document.getElementById('nac-sesiones').value;
    const profesional = document.getElementById('nac-prof').value;
    if (!nombre) { showToast('⚠️ Ingresá el nombre'); return; }
    await fetch('/api/pacientes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-panel-password': password },
      body: JSON.stringify({ nombre, obra_social, plan, sesiones_total: parseInt(sesiones_total), profesional })
    });
    document.getElementById('nac-nombre').value = '';
    document.getElementById('nac-os').value = '';
    document.getElementById('nac-plan').value = '';
    cargarPacientes();
    showToast('✅ Paciente agregado');
  }

  async function ajustarSesion(id, delta) {
    const r = await fetch(`/api/pacientes/${id}`, { headers: { 'x-panel-password': password } });
    // No hay GET individual, usamos la lista
    const rl = await fetch('/api/pacientes', { headers: { 'x-panel-password': password } });
    const data = await rl.json();
    const p = data.pacientes.find(x => x.id === id);
    if (!p) return;
    const nuevasUsadas = Math.max(0, Math.min(p.sesiones_total, p.sesiones_usadas + delta));
    await fetch(`/api/pacientes/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-panel-password': password },
      body: JSON.stringify({ sesiones_usadas: nuevasUsadas })
    });
    cargarPacientes();
    showToast(delta > 0 ? '➕ Sesión sumada' : '➖ Sesión restada');
  }

  function abrirEditar(id, nombre, os, plan, total, usadas, prof) {
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-nombre').value = nombre;
    document.getElementById('edit-os').value = os;
    document.getElementById('edit-plan').value = plan;
    document.getElementById('edit-total').value = total;
    document.getElementById('edit-usadas').value = usadas;
    document.getElementById('edit-prof').value = prof;
    document.getElementById('modal-editar').classList.add('open');
  }

  function cerrarModal() { document.getElementById('modal-editar').classList.remove('open'); }

  async function guardarEdicion() {
    const id = document.getElementById('edit-id').value;
    await fetch(`/api/pacientes/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-panel-password': password },
      body: JSON.stringify({
        nombre: document.getElementById('edit-nombre').value.trim(),
        obra_social: document.getElementById('edit-os').value.trim(),
        plan: document.getElementById('edit-plan').value.trim(),
        sesiones_total: parseInt(document.getElementById('edit-total').value),
        sesiones_usadas: parseInt(document.getElementById('edit-usadas').value),
        profesional: document.getElementById('edit-prof').value
      })
    });
    cerrarModal();
    cargarPacientes();
    showToast('✅ Paciente actualizado');
  }

  async function eliminarPaciente(id) {
    if (!confirm('¿Eliminar este paciente?')) return;
    await fetch(`/api/pacientes/${id}`, { method: 'DELETE', headers: { 'x-panel-password': password } });
    cargarPacientes();
    showToast('🗑️ Paciente eliminado');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
